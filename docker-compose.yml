services:
  db:
    image: postgres:16-alpine
    container_name: dyligent-sdr-db
    restart: unless-stopped
    environment:
      POSTGRES_USER: dyligent
      POSTGRES_PASSWORD: dyligent
      POSTGRES_DB: dyligent_sdr
    ports:
      - "5432:5432"
    volumes:
      - dyligent_pgdata:/var/lib/postgresql/data

volumes:
  dyligent_pgdata:
